- id: TLS_NEGOTIATED_TLS10_DISCOURAGED
  target: handshake
  effective_from: '2015-05-01'
  roles: []
  where:
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  assertion:
  - path: handshake.version.selected
    operator: not_eq
    value: TLSv10
  severity:
    negative: medium
    indeterminate: informational
  title: TLS 1.0 negotiated (historical SHOULD NOT)
  rationale: Before RFC 8996, RFC 7525 said implementations SHOULD NOT negotiate TLS
    1.0.
  standards:
  - RFC 7525 §3.1.1
  remediation_id: tls.minimum_version
  tests:
  - id: rejects_tls10_2018
    at: '2018-06-01'
