    operator: eq
    value: violation
  assertion:
  - path: session.explicit_upgrade.state
    operator: eq
    value: tls_established
  severity:
    negative: high
    indeterminate: informational
  title: STARTTLS/STLS accepted without TLS transition
  rationale: Application commands after an accepted upgrade and before TLS is a protocol-state
