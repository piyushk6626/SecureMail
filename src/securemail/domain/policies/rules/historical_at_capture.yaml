      session.explicit_upgrade.evidence_state: observed
    expected: negative
  - id: accepts_established
    at: 2026-09-01
    values:
      session.explicit_upgrade.state: tls_established
      session.explicit_upgrade.evidence_state: observed
    expected: pass
