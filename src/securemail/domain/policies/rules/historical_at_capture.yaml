schema_version: securemail.policy/v1
profile: historical_at_capture
version: "2026.09.0"
evaluation_clock: capture_start_time
roles:
- id: smtp_relay
  all:
  - path: session.protocol
    state_path: session.evidence_state
    operator: eq
    value: smtp
  - path: flow.resp.port
    state_path: flow.evidence_state
    operator: eq
    value: 25
- id: smtp_submission
  all:
  - path: session.protocol
    state_path: session.evidence_state
    operator: eq
    value: smtp
  - path: flow.resp.port
    state_path: flow.evidence_state
    operator: in
    value:
    - 465
    - 587
- id: imap_access
  all:
  - path: session.protocol
    state_path: session.evidence_state
    operator: eq
    value: imap
  - path: flow.resp.port
    state_path: flow.evidence_state
    operator: in
    value:
    - 143
    - 993
- id: pop3_access
  all:
  - path: session.protocol
    state_path: session.evidence_state
    operator: eq
    value: pop3
  - path: flow.resp.port
    state_path: flow.evidence_state
    operator: in
    value:
    - 110
    - 995
rules:
- id: TLS_NEGOTIATED_SSL3
  target: handshake
  effective_from: 2015-06-01
  roles: []
  where:
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  assertion:
  - path: handshake.version.selected
    operator: not_eq
    value: SSLv3
  severity:
    negative: high
    indeterminate: informational
  title: SSLv3 negotiated
  rationale: SSLv3 is prohibited. Implementations MUST NOT negotiate SSL version 3.0.
  standards:
  - RFC 7568 §3
  remediation_id: tls.minimum_version
  tests:
  - id: rejects_ssl3
    at: 2026-09-01
    values:
      handshake.version.selected: SSLv3
      handshake.version.evidence_state: observed
    expected: negative
  - id: accepts_tls12
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
    expected: pass
- id: TLS_NEGOTIATED_TLS10
  target: handshake
  effective_from: 2021-03-01
  roles: []
  where:
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  assertion:
  - path: handshake.version.selected
    operator: not_eq
    value: TLSv10
  severity:
    negative: high
    indeterminate: informational
  title: TLS 1.0 negotiated
  rationale: TLS 1.0 is formally deprecated. Implementations MUST NOT negotiate TLS
    1.0.
  standards:
  - RFC 8996 §4
  - RFC 9325 §3.1.1
  remediation_id: tls.minimum_version
  tests:
  - id: rejects_tls10
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv10
      handshake.version.evidence_state: observed
    expected: negative
  - id: accepts_tls12
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
    expected: pass
- id: TLS_NEGOTIATED_TLS11
  target: handshake
  effective_from: 2021-03-01
  roles: []
  where:
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  assertion:
  - path: handshake.version.selected
    operator: not_eq
    value: TLSv11
  severity:
    negative: high
    indeterminate: informational
  title: TLS 1.1 negotiated
  rationale: TLS 1.1 is formally deprecated. Implementations MUST NOT negotiate TLS
    1.1.
  standards:
  - RFC 8996 §4
  - RFC 9325 §3.1.1
  remediation_id: tls.minimum_version
  tests:
  - id: rejects_tls11
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv11
      handshake.version.evidence_state: observed
    expected: negative
  - id: accepts_tls12
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
    expected: pass
- id: TLS_CIPHER_NULL
  target: handshake
  effective_from: 2015-05-01
  roles: []
  where:
  - path: handshake.cipher_suite.evidence_state
    operator: in
    value:
    - observed
    - inferred
  assertion:
  - path: handshake.cipher_suite.name
    operator: contains_none
    value:
    - _NULL_
  severity:
    negative: high
    indeterminate: informational
  title: NULL cipher suite negotiated
  rationale: NULL encryption provides no confidentiality and MUST NOT be negotiated.
  standards:
  - RFC 9325 §4.1
  remediation_id: tls.disable_null_ciphers
  tests:
  - id: rejects_null
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_NULL_SHA
      handshake.cipher_suite.evidence_state: observed
    expected: negative
  - id: accepts_aes
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      handshake.cipher_suite.evidence_state: observed
    expected: pass
- id: TLS_CIPHER_EXPORT
  target: handshake
  effective_from: 2015-05-01
  roles: []
  where:
  - path: handshake.cipher_suite.evidence_state
    operator: in
    value:
    - observed
    - inferred
  assertion:
  - path: handshake.cipher_suite.name
    operator: contains_none
    value:
    - _EXPORT_
  severity:
    negative: high
    indeterminate: informational
  title: Export-grade cipher suite negotiated
  rationale: Export cipher suites are obsolete and provide less than 112-bit security.
  standards:
  - RFC 9325 §4.1
  remediation_id: tls.disable_export_ciphers
  tests:
  - id: rejects_export
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_EXPORT_WITH_RC4_40_MD5
      handshake.cipher_suite.evidence_state: observed
    expected: negative
  - id: accepts_aes
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_AES_128_CBC_SHA
      handshake.cipher_suite.evidence_state: observed
    expected: pass
- id: TLS_CIPHER_RC4
  target: handshake
  effective_from: 2015-02-01
  roles: []
  where:
  - path: handshake.cipher_suite.evidence_state
    operator: in
    value:
    - observed
    - inferred
  assertion:
  - path: handshake.cipher_suite.name
    operator: contains_none
    value:
    - _RC4_
  severity:
    negative: high
    indeterminate: informational
  title: RC4 cipher suite negotiated
  rationale: RC4 cipher suites MUST NOT be negotiated.
  standards:
  - RFC 7465 §2
  - RFC 9325 §4.1
  remediation_id: tls.disable_rc4
  tests:
  - id: rejects_rc4
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_RC4_128_SHA
      handshake.cipher_suite.evidence_state: observed
    expected: negative
  - id: accepts_aes
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_AES_128_CBC_SHA
      handshake.cipher_suite.evidence_state: observed
    expected: pass
- id: TLS_CIPHER_3DES
  target: handshake
  effective_from: 2022-11-01
  roles: []
  where:
  - path: handshake.cipher_suite.evidence_state
    operator: in
    value:
    - observed
    - inferred
  assertion:
  - path: handshake.cipher_suite.name
    operator: contains_none
    value:
    - _3DES_
    - _DES_EDE_
  severity:
    negative: medium
    indeterminate: informational
  title: 3DES cipher suite negotiated
  rationale: 3DES cipher suites SHOULD NOT be negotiated under current IETF recommendations.
  standards:
  - RFC 9325 §4.1
  remediation_id: tls.disable_3des
  tests:
  - id: rejects_3des
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_3DES_EDE_CBC_SHA
      handshake.cipher_suite.evidence_state: observed
    expected: negative
  - id: accepts_aes
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_AES_128_CBC_SHA
      handshake.cipher_suite.evidence_state: observed
    expected: pass
- id: TLS_CIPHER_CBC
  target: handshake
  effective_from: 2022-11-01
  roles: []
  where:
  - path: handshake.cipher_suite.evidence_state
    operator: in
    value:
    - observed
    - inferred
  - path: handshake.version.selected
    operator: in
    value:
    - TLSv10
    - TLSv11
    - TLSv12
  assertion:
  - path: handshake.cipher_suite.name
    operator: contains_none
    value:
    - _CBC_
  severity:
    negative: medium
    indeterminate: informational
  title: TLS CBC cipher suite negotiated
  rationale: CBC cipher suites in TLS 1.2 and earlier SHOULD NOT be negotiated.
  standards:
  - RFC 9325 §4.2
  remediation_id: tls.prefer_aead
  tests:
  - id: rejects_cbc
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_RSA_WITH_AES_128_CBC_SHA
      handshake.cipher_suite.evidence_state: observed
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
    expected: negative
  - id: accepts_gcm
    at: 2026-09-01
    values:
      handshake.cipher_suite.name: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      handshake.cipher_suite.evidence_state: observed
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
    expected: pass
- id: TLS12_STATIC_RSA_NEGOTIATED
  target: handshake
  effective_from: 2026-07-01
  roles: []
  where:
  - path: handshake.version.selected
    operator: eq
    value: TLSv12
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  - path: handshake.key_exchange.evidence_state
    operator: in
    value:
    - observed
    - inferred
    - verified
  assertion:
  - path: handshake.key_exchange.mechanism
    operator: not_eq
    value: RSA
  severity:
    negative: high
    indeterminate: informational
  title: TLS 1.2 static RSA key exchange
  rationale: Clients MUST NOT offer and servers MUST NOT select RSA key-exchange cipher
    suites in TLS 1.2.
  standards:
  - RFC 10015 §4
  remediation_id: tls.disable_static_rsa
  tests:
  - id: rejects_static_rsa
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: RSA
      handshake.key_exchange.evidence_state: inferred
    expected: negative
  - id: accepts_ecdhe
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: ECDHE
      handshake.key_exchange.evidence_state: inferred
    expected: pass
- id: TLS12_STATIC_DH_NEGOTIATED
  target: handshake
  effective_from: 2026-07-01
  roles: []
  where:
  - path: handshake.version.selected
    operator: eq
    value: TLSv12
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  - path: handshake.key_exchange.evidence_state
    operator: in
    value:
    - observed
    - inferred
    - verified
  assertion:
  - path: handshake.key_exchange.mechanism
    operator: not_eq
    value: DH
  severity:
    negative: high
    indeterminate: informational
  title: TLS 1.2 static finite-field DH
  rationale: Non-ephemeral FFDH cipher suites MUST NOT be selected in TLS 1.2.
  standards:
  - RFC 10015 §2
  remediation_id: tls.disable_static_dh
  tests:
  - id: rejects_static_dh
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: DH
      handshake.key_exchange.evidence_state: inferred
    expected: negative
  - id: accepts_ecdhe
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: ECDHE
      handshake.key_exchange.evidence_state: inferred
    expected: pass
- id: TLS12_DHE_NEGOTIATED
  target: handshake
  effective_from: 2026-07-01
  roles: []
  where:
  - path: handshake.version.selected
    operator: eq
    value: TLSv12
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  - path: handshake.key_exchange.evidence_state
    operator: in
    value:
    - observed
    - inferred
    - verified
  assertion:
  - path: handshake.key_exchange.mechanism
    operator: not_eq
    value: DHE
  severity:
    negative: high
    indeterminate: informational
  title: TLS 1.2 finite-field DHE
  rationale: FFDHE cipher suites MUST NOT be selected in TLS 1.2. This is not a forward-secrecy
    failure.
  standards:
  - RFC 10015 §3
  remediation_id: tls.disable_ffdhe_tls12
  tests:
  - id: rejects_dhe
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: DHE
      handshake.key_exchange.evidence_state: inferred
    expected: negative
  - id: accepts_ecdhe
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: ECDHE
      handshake.key_exchange.evidence_state: inferred
    expected: pass
- id: TLS12_STATIC_ECDH_NEGOTIATED
  target: handshake
  effective_from: 2022-11-01
  roles: []
  where:
  - path: handshake.version.selected
    operator: eq
    value: TLSv12
  - path: handshake.version.evidence_state
    operator: in
    value:
    - observed
    - verified
  - path: handshake.key_exchange.evidence_state
    operator: in
    value:
    - observed
    - inferred
    - verified
  assertion:
  - path: handshake.key_exchange.mechanism
    operator: not_eq
    value: ECDH
  severity:
    negative: medium
    indeterminate: informational
  title: TLS 1.2 static ECDH
  rationale: Non-ephemeral ECDH cipher suites SHOULD NOT be selected in TLS 1.2.
  standards:
  - RFC 9325 §4.2
  - RFC 10015 §2
  remediation_id: tls.disable_static_ecdh
  tests:
  - id: rejects_static_ecdh
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: ECDH
      handshake.key_exchange.evidence_state: inferred
    expected: negative
  - id: accepts_ecdhe
    at: 2026-09-01
    values:
      handshake.version.selected: TLSv12
      handshake.version.evidence_state: observed
      handshake.key_exchange.mechanism: ECDHE
      handshake.key_exchange.evidence_state: inferred
    expected: pass
- id: TLS12_DHE_PARAMETERS_LT2048
  target: handshake
  effective_from: 2022-11-01
  roles: []
  where:
  - path: handshake.key_exchange.mechanism
    operator: eq
    value: DHE
  - path: handshake.key_exchange.dh_param_size
    operator: gt
    value: 0
  assertion:
  - path: handshake.key_exchange.dh_param_size
    operator: gte
    value: 2048
  severity:
    negative: high
    indeterminate: informational
  title: TLS DHE parameters shorter than 2048 bits
  rationale: Finite-field DH parameters MUST be at least 2048 bits.
  standards:
  - RFC 9325 §4.5
  remediation_id: tls.dhe_2048
  tests:
  - id: rejects_1024
    at: 2026-09-01
    values:
      handshake.key_exchange.mechanism: DHE
      handshake.key_exchange.evidence_state: inferred
      handshake.key_exchange.dh_param_size: 1024
    expected: negative
  - id: accepts_2048
    at: 2026-09-01
    values:
      handshake.key_exchange.mechanism: DHE
      handshake.key_exchange.evidence_state: inferred
      handshake.key_exchange.dh_param_size: 2048
    expected: pass
- id: TLS_HANDSHAKE_SIGNATURE_MD5
  target: handshake
  effective_from: 2021-12-01
  roles: []
  where:
  - path: handshake.certificate_verify_signature.evidence_state
    operator: eq
    value: observed
  assertion:
  - path: handshake.certificate_verify_signature.algorithm
    operator: contains_none
    value:
    - md5
  severity:
    negative: high
    indeterminate: informational
  title: MD5 handshake CertificateVerify
  rationale: MD5 MUST NOT be used for TLS digital signatures.
  standards:
  - RFC 9155 §3
  remediation_id: tls.disable_md5_signatures
  tests:
  - id: rejects_md5
    at: 2026-09-01
    values:
      handshake.certificate_verify_signature.algorithm: rsa_pkcs1_md5
      handshake.certificate_verify_signature.evidence_state: observed
    expected: negative
  - id: accepts_sha256
    at: 2026-09-01
    values:
      handshake.certificate_verify_signature.algorithm: rsa_pkcs1_sha256
      handshake.certificate_verify_signature.evidence_state: observed
    expected: pass
- id: TLS_HANDSHAKE_SIGNATURE_SHA1
  target: handshake
  effective_from: 2021-12-01
  roles: []
  where:
  - path: handshake.certificate_verify_signature.evidence_state
    operator: eq
    value: observed
  assertion:
  - path: handshake.certificate_verify_signature.algorithm
    operator: contains_none
    value:
    - sha1
  severity:
    negative: high
    indeterminate: informational
  title: SHA-1 handshake CertificateVerify
  rationale: SHA-1 MUST NOT be used for TLS digital signatures. This is not the X.509
    certificate signature.
  standards:
  - RFC 9155 §3
  remediation_id: tls.disable_sha1_handshake_signatures
  tests:
  - id: rejects_sha1
    at: 2026-09-01
    values:
      handshake.certificate_verify_signature.algorithm: rsa_pkcs1_sha1
      handshake.certificate_verify_signature.evidence_state: observed
    expected: negative
  - id: accepts_sha256
    at: 2026-09-01
    values:
      handshake.certificate_verify_signature.algorithm: rsa_pkcs1_sha256
      handshake.certificate_verify_signature.evidence_state: observed
    expected: pass
- id: TLS_FORWARD_SECRECY_ABSENT
  target: handshake
  effective_from: 2015-05-01
  roles: []
  where:
  - path: derived.forward_secrecy.outcome
    operator: eq
    value: absent
  assertion:
  - path: derived.forward_secrecy.outcome
    operator: eq
    value: present
  severity:
    negative: medium
    indeterminate: informational
  title: Forward secrecy absent
  rationale: Static RSA, DH, or ECDH key exchange does not provide forward secrecy.
  standards:
  - RFC 9325 §4.2
  remediation_id: tls.require_ephemeral_kx
  tests:
  - id: rejects_absent
    at: 2026-09-01
    values:
      derived.forward_secrecy.outcome: absent
      derived.forward_secrecy.evidence_state: inferred
    expected: negative
  - id: accepts_present
    at: 2026-09-01
    values:
      derived.forward_secrecy.outcome: present
      derived.forward_secrecy.evidence_state: observed
    expected: pass
- id: TLS_FORWARD_SECRECY_INDETERMINATE
  target: handshake
  effective_from: 2018-08-01
  roles: []
  fail_outcome: indeterminate
  where:
  - path: derived.forward_secrecy.outcome
    operator: eq
    value: indeterminate
  assertion:
  - path: derived.forward_secrecy.outcome
    operator: eq
    value: present
  severity:
    negative: informational
    indeterminate: informational
  title: Forward secrecy indeterminate
  rationale: PSK-only resumption or missing handshake evidence cannot prove forward
    secrecy from one PCAP.
  standards:
  - RFC 8446 §2.2
  remediation_id: tls.observe_full_handshake
  tests:
  - id: psk_only
    at: 2026-09-01
    values:
      derived.forward_secrecy.outcome: indeterminate
      derived.forward_secrecy.evidence_state: indeterminate
    expected: indeterminate
  - id: present_skips
    at: 2026-09-01
    values:
      derived.forward_secrecy.outcome: present
      derived.forward_secrecy.evidence_state: observed
    expected: pass
- id: CERT_RSA_KEY_LT2048
  target: certificate
  effective_from: 2022-11-01
  roles: []
  where:
  - path: certificate.role
    operator: eq
    value: server
  - path: certificate.chain_index
    operator: eq
    value: 0
  - path: certificate.public_key_algorithm
    operator: eq
    value: RSA
  assertion:
  - path: certificate.public_key_size
    operator: gte
    value: 2048
  severity:
    negative: high
    indeterminate: informational
  title: RSA authentication key shorter than 2048 bits
  rationale: RSA certificates used to authenticate TLS MUST use a modulus of at least
    2048 bits.
  standards:
  - RFC 9325 §4.5
  remediation_id: pki.rsa_2048
  tests:
  - id: rejects_1536
    at: 2026-09-01
    values:
      certificate.role: server
      certificate.chain_index: 0
      certificate.public_key_algorithm: RSA
      certificate.public_key_size: 1536
      certificate.evidence_state: observed
    expected: negative
  - id: accepts_2048
    at: 2026-09-01
    values:
      certificate.role: server
      certificate.chain_index: 0
      certificate.public_key_algorithm: RSA
      certificate.public_key_size: 2048
      certificate.evidence_state: observed
    expected: pass
- id: CERT_PUBLIC_KEY_STRENGTH_LT112
  target: certificate
  effective_from: 2019-03-01
  roles: []
  where:
  - path: certificate.role
    operator: eq
    value: server
  - path: certificate.chain_index
    operator: eq
    value: 0
  - path: certificate.effective_strength_bits
    operator: gt
    value: 0
  assertion:
  - path: certificate.effective_strength_bits
    operator: gte
    value: 112
  severity:
    negative: medium
    indeterminate: informational
  title: Public key comparable strength below 112 bits
  rationale: Keys providing less than 112 bits of comparable security are below the
    current IETF/NIST floor.
  standards:
  - RFC 9325 §4.1
  - NIST SP 800-57 Part 1 Rev. 5
  remediation_id: pki.minimum_strength_112
  tests:
  - id: rejects_80
    at: 2026-09-01
    values:
      certificate.role: server
      certificate.chain_index: 0
      certificate.effective_strength_bits: 80
      certificate.evidence_state: observed
    expected: negative
  - id: accepts_112
    at: 2026-09-01
    values:
      certificate.role: server
      certificate.chain_index: 0
      certificate.effective_strength_bits: 112
      certificate.evidence_state: observed
    expected: pass
- id: CERT_SIGNATURE_MD5
  target: certificate
  effective_from: 2015-05-01
  roles: []
  where:
  - path: certificate.role
    operator: eq
    value: server
  - path: certificate.chain_index
    operator: eq
    value: 0
  assertion:
  - path: certificate.signature_algorithm
    operator: contains_none
    value:
    - md5
  severity:
    negative: high
    indeterminate: informational
  title: MD5 certificate signature
  rationale: MD5 certificate signatures are cryptographically broken. This is not
    RFC 9155 CertificateVerify.
  standards:
  - RFC 9325 §4.5
  remediation_id: pki.disable_md5_cert_signatures
  tests:
  - id: rejects_md5
    at: 2026-09-01
    values:
      certificate.role: server
      certificate.chain_index: 0
      certificate.signature_algorithm: md5WithRSAEncryption
      certificate.evidence_state: observed
    expected: negative
  - id: accepts_sha256
    at: 2026-09-01
    values:
