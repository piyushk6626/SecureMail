      handshake.version.selected: TLSv10
      handshake.version.evidence_state: observed
    expected: negative
  - id: inactive_after_8996
    at: '2022-01-01'
    values:
      handshake.version.selected: TLSv10
      handshake.version.evidence_state: observed
    expected: pass
  effective_until: '2021-03-01'
