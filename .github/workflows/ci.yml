name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-lfs \
            pkg-config \
            libpango1.0-dev \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libharfbuzz0b
          git lfs install
          git lfs pull
      - name: Sync Python environment
        run: uv sync --extra dev --extra reports --extra ml --extra api
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Doctor
        env:
          SECUREMAIL_CI: "1"
        run: make doctor
      - name: Lint
        run: make lint
      - name: Analyzer images
        run: |
          docker pull zeek/zeek@sha256:73e80e9cd23ff71fd28d158e9a9af5c7b2b0ef5d4036af61521827531347c0e3
          make zeek-image
          make tshark-image
      - name: Test
        run: make test
      - name: Build dashboard
        run: make frontend-build

  dashboard-e2e:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Sync API environment
        run: uv sync --extra api --extra dev
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Dashboard end-to-end tests
        run: make e2e

  digest-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned analyzer digests
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("tools/analyzer-bundle.lock").read_text())
          dockerfile = Path("docker/tshark/Dockerfile").read_text()
          match = re.search(r"debian:trixie-slim@(sha256:[0-9a-f]+)", dockerfile)
          if match is None:
              raise SystemExit("could not parse debian digest from docker/tshark/Dockerfile")
          print(f"zeek={lock['zeek_image_digest']}")
          print(f"tshark_base={match.group(1)}")
          Path("/tmp/zeek_digest").write_text(lock["zeek_image_digest"])
          Path("/tmp/debian_digest").write_text(match.group(1))
          PY
          docker manifest inspect "zeek/zeek@$(cat /tmp/zeek_digest)" >/dev/null
          docker manifest inspect "debian@$(cat /tmp/debian_digest)" >/dev/null
          echo "pinned digests resolved"
