[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securemail"
version = "0.0.0"
description = "Offline SMTP/IMAP/POP3 cryptographic posture analysis from PCAP captures"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "SecureMail" }]
dependencies = [
    "pydantic>=2",
    "typer",
    "cryptography",
    "pyyaml",
    "jinja2",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
reports = ["weasyprint==69.0"]
ml = ["scikit-learn", "numpy", "scipy"]
api = ["fastapi", "uvicorn", "sqlalchemy", "asyncpg", "alembic"]
dev = [
    "pytest",
    "hypothesis",
    "import-linter",
    "ruff",
    "mypy",
    "pre-commit",
    "playwright",
    "scapy",
    "jsonschema",
    "pypdf",
    "httpx",
]

[project.scripts]
securemail = "securemail.api.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py313"
src = ["src", "tests", "tools"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["securemail"]

[tool.importlinter]
root_package = "securemail"

[[tool.importlinter.contracts]]
name = "Domain has no outward dependencies"
type = "forbidden"
source_modules = ["securemail.domain"]
forbidden_modules = [
    "securemail.adapters",
    "securemail.ports",
    "securemail.application",
    "securemail.api",
]

[[tool.importlinter.contracts]]
name = "Application does not import concrete adapters"
type = "forbidden"
source_modules = ["securemail.application"]
forbidden_modules = ["securemail.adapters"]

[[tool.importlinter.contracts]]
name = "Layers are independent of api"
type = "forbidden"
source_modules = [
    "securemail.domain",
    "securemail.application",
    "securemail.adapters",
    "securemail.ports",
]
forbidden_modules = ["securemail.api"]
